name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: registry.codesecuresolutions.com
  IMAGE_NAME: base-app-3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Validate backend dependencies
        working-directory: backend
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked
          php artisan test

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm audit --omit=dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: base-app-3:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          docker run --detach \
            --name base-app-3 \
            --publish 8080:80 \
            --env APP_ENV=testing \
            --env APP_DEBUG=false \
            --env APP_KEY="${APP_KEY}" \
            --env DB_CONNECTION=sqlite \
            --env DB_DATABASE=/var/www/html/database/database.sqlite \
            base-app-3:test

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/fpm-ping >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/api/status >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs base-app-3
          exit 1

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate frontend configuration
        shell: bash
        env:
          VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID }}
          VITE_ISSUER_LOGIN: ${{ vars.VITE_ISSUER_LOGIN }}
          VITE_AUTHORIZE_URL: ${{ vars.VITE_AUTHORIZE_URL }}
          VITE_TOKEN_ENDPOINT: ${{ vars.VITE_TOKEN_ENDPOINT }}
          VITE_USER_API_ENDPOINT: ${{ vars.VITE_USER_API_ENDPOINT }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI }}
          VITE_API_GATEWAY_URL: ${{ vars.VITE_API_GATEWAY_URL }}
        run: |
          required=(
            VITE_CLIENT_ID
            VITE_ISSUER_LOGIN
            VITE_AUTHORIZE_URL
            VITE_TOKEN_ENDPOINT
            VITE_USER_API_ENDPOINT
            VITE_REDIRECT_URI
            VITE_API_GATEWAY_URL
          )

          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              missing+=("${variable}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions Variables: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Code Secure Solutions registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_CLIENT_ID=${{ vars.VITE_CLIENT_ID }}
            VITE_ISSUER_LOGIN=${{ vars.VITE_ISSUER_LOGIN }}
            VITE_AUTHORIZE_URL=${{ vars.VITE_AUTHORIZE_URL }}
            VITE_TOKEN_ENDPOINT=${{ vars.VITE_TOKEN_ENDPOINT }}
            VITE_USER_API_ENDPOINT=${{ vars.VITE_USER_API_ENDPOINT }}
            VITE_REDIRECT_URI=${{ vars.VITE_REDIRECT_URI }}
            VITE_API_GATEWAY_URL=${{ vars.VITE_API_GATEWAY_URL }}
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
