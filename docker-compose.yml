name: base-app-3

services:
  app:
    image: ${BASE_APP_IMAGE:-base-app-3:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
        VITE_ISSUER_LOGIN: ${VITE_ISSUER_LOGIN:-https://login.cultura.gob.sv}
        VITE_AUTHORIZE_URL: ${VITE_AUTHORIZE_URL:-https://login.cultura.gob.sv/oauth/authorize}
        VITE_TOKEN_ENDPOINT: ${VITE_TOKEN_ENDPOINT:-https://login.cultura.gob.sv/oauth/token}
        VITE_USER_API_ENDPOINT: ${VITE_USER_API_ENDPOINT:-https://login.cultura.gob.sv/api/user}
        VITE_REDIRECT_URI: ${VITE_REDIRECT_URI:-http://localhost:8080/callback}
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: ${APP_NAME:-Base App 3}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-backend}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
    volumes:
      - app_storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  app_storage:
